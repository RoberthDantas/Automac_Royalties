{% extends "core/base.html" %}{% block content %}<p>{{ count }} municípios no filtro. <a href="/pocos/mapa/">Abrir mapa interno</a></p><form method="get"><label>Nome ou código IBGE<input name="q" value="{{ q }}"></label><label>UF<select name="uf"><option value="">Todas</option>{% for state in ufs %}<option {% if state == uf %}selected{% endif %}>{{ state }}</option>{% endfor %}</select></label><button>Filtrar</button></form><div class="card"><table><tr><th>Município</th><th>UF</th><th>IBGE</th><th>Mapa</th></tr>{% for m in records %}<tr><td><a href="/municipios/{{ m.pk }}/">{{ m.name }}</a></td><td>{{ m.uf }}</td><td>{{ m.pk }}</td><td><a href="/pocos/mapa/?uf={{ m.uf }}&municipio={{ m.pk }}">Localizar</a></td></tr>{% endfor %}</table>{% include "core/pagination.html" %}</div>{% endblock %}
